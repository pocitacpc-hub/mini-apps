<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000">
  <title>Mini Apps – rozcestník</title>
  <link rel="stylesheet" href="shared/shell.css" />
  <script defer src="shared/hub.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/mini-apps-180.png">
  <script defer src="shared/pwa.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
          <path d="M18 18h28v28H18z" stroke="currentColor" stroke-width="3" />
          <path d="M24 32h16" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          <path d="M32 24v16" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <div>
        <div class="title">Mini Apps</div>
        <div class="subtitle">Rozcestník aplikací</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-card">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="hero-content">
          <h1>Rozcestník</h1>

          <div class="hub-controls">
            <input id="search" class="hub-search" type="text" placeholder="Hledat aplikaci…" aria-label="Hledat aplikaci" />
            <button type="button" id="installApp" class="btn primary hub-install" hidden>Instalovat Mini Apps</button>
          </div>

          <div id="appGrid" class="app-grid" aria-live="polite"></div>
          <div id="hubError" class="hub-error" role="alert" style="display:none;"></div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
